name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Run regression suite
        shell: pwsh
        run: >
          dotnet run
          --project .\src\Peggy.Core.Tests\Peggy.Core.Tests.csproj
          -c Release

      - name: Build self-contained package, ZIP, and MSI
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          .\scripts\Build-WindowsRelease.ps1 `
            -Version $env:TAG `
            -OutputDirectory $env:RUNNER_TEMP `
            -SkipBundle `
            -SkipChecksums

      # Authenticode boundary: a future signing job signs the MSI here so the
      # Burn bundle embeds the signed package. No certificate is configured yet.
      - name: Build bootstrapper
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          .\scripts\Build-PeggyBundle.ps1 `
            -Version $env:TAG `
            -MsiPath (Join-Path $env:RUNNER_TEMP "peggy-win-x64.msi") `
            -OutputDirectory $env:RUNNER_TEMP `
            -SkipChecksum

      # Authenticode boundary: a future signing job signs the completed Burn
      # executable here. Checksums must always be generated after signing.
      - name: Generate release checksums
        shell: pwsh
        run: |
          .\scripts\New-PeggyReleaseChecksums.ps1 `
            -ArtifactDirectory $env:RUNNER_TEMP `
            -RequireBootstrapper

      - name: Validate MSI and bootstrapper
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          .\scripts\Test-PeggyWindowsInstaller.ps1 `
            -Version $env:TAG `
            -ArtifactDirectory $env:RUNNER_TEMP `
            -SkipPrerequisiteExecution

      - name: Regress real in-place MSI upgrade and rollback
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP "peggy-upgrade-baseline-v0.1.10"
          New-Item -ItemType Directory -Path $baseline -Force | Out-Null
          gh release download v0.1.10 --repo "${{ github.repository }}" `
            --pattern peggy-win-x64.msi --pattern peggy-win-x64.msi.sha256 `
            --dir $baseline --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Could not download the pinned v0.1.10 upgrade baseline."
          }
          $checksum = (Get-Content -LiteralPath (Join-Path $baseline "peggy-win-x64.msi.sha256") -Raw).Trim()
          if ($checksum -notmatch '^([a-fA-F0-9]{64})\s+\*?peggy-win-x64\.msi$') {
            throw "Malformed v0.1.10 MSI checksum."
          }
          $expectedHash = $Matches[1]
          $previousMsi = Join-Path $baseline "peggy-win-x64.msi"
          if ((Get-FileHash -LiteralPath $previousMsi -Algorithm SHA256).Hash -ne $expectedHash) {
            throw "Pinned v0.1.10 MSI checksum does not match."
          }
          .\scripts\Test-PeggyWindowsUpgrade.ps1 `
            -PreviousMsiPath $previousMsi `
            -MsiPath (Join-Path $env:RUNNER_TEMP "peggy-win-x64.msi") `
            -PayloadDirectory (Join-Path $env:RUNNER_TEMP "peggy-win-x64") `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP "peggy-upgrade-regression")

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          $assets = @(
            (Join-Path $env:RUNNER_TEMP "peggy-win-x64.zip"),
            (Join-Path $env:RUNNER_TEMP "peggy-win-x64.sha256"),
            (Join-Path $env:RUNNER_TEMP "peggy-win-x64.msi"),
            (Join-Path $env:RUNNER_TEMP "peggy-win-x64.msi.sha256"),
            (Join-Path $env:RUNNER_TEMP "peggy-win-x64-setup.exe"),
            (Join-Path $env:RUNNER_TEMP "peggy-win-x64-setup.exe.sha256"),
            ".\install.ps1",
            ".\uninstall.ps1"
          )

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            $arguments = @(
              "release", "create", $tag
            ) + $assets + @(
              "--verify-tag",
              "--generate-notes",
              "--title", "Peggy $tag"
            )
            if ($tag.Contains("-")) {
              $arguments += "--prerelease"
            }
            & gh @arguments
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed."
          }
