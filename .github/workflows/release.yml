name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Run regression suite
        shell: pwsh
        run: >
          dotnet run
          --project .\src\Peggy.Core.Tests\Peggy.Core.Tests.csproj
          -c Release

      - name: Build self-contained package, ZIP, and MSI
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          .\scripts\Test-PeggyReleaseAssets.ps1
          .\scripts\Test-PeggyBootstrapperPayload.ps1
          .\scripts\Build-WindowsRelease.ps1 `
            -Version $env:TAG `
            -OutputDirectory $env:RUNNER_TEMP `
            -SkipBundle `
            -SkipChecksums

      # Authenticode boundary: a future signing job signs the MSI here so the
      # Burn bundle embeds the signed package. No certificate is configured yet.
      - name: Build bootstrapper
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          . .\scripts\PeggyInstallerVersion.ps1
          $names = (ConvertTo-PeggyInstallerVersion -Version $env:TAG).AssetNames
          .\scripts\Build-PeggyBundle.ps1 `
            -Version $env:TAG `
            -MsiPath (Join-Path $env:RUNNER_TEMP $names.Msi) `
            -OutputDirectory $env:RUNNER_TEMP `
            -SkipChecksum

      # Authenticode boundary: a future signing job signs the completed Burn
      # executable here. Checksums must always be generated after signing.
      - name: Generate release checksums
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          .\scripts\New-PeggyReleaseChecksums.ps1 `
            -Version $env:TAG `
            -ArtifactDirectory $env:RUNNER_TEMP `
            -RequireBootstrapper

      - name: Validate MSI and bootstrapper
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          .\scripts\Test-PeggyWindowsInstaller.ps1 `
            -Version $env:TAG `
            -ArtifactDirectory $env:RUNNER_TEMP `
            -SkipPrerequisiteExecution
          .\scripts\Test-PeggyUnifiedSetupLayout.ps1 `
            -Version $env:TAG `
            -ArtifactDirectory $env:RUNNER_TEMP

      - name: Regress real in-place MSI upgrade and rollback
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          . .\scripts\PeggyInstallerVersion.ps1
          $names = (ConvertTo-PeggyInstallerVersion -Version $env:TAG).AssetNames
          .\scripts\Test-PeggyBundleMsi.ps1 `
            -Version $env:TAG `
            -BundlePath (Join-Path $env:RUNNER_TEMP $names.Bundle) `
            -MsiPath (Join-Path $env:RUNNER_TEMP $names.Msi) `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP "peggy-bundle-msi-tests")
          $baselines = @(
            @{ Tag = "v0.1.10"; Bundle = "peggy-win-x64-setup.exe" },
            @{ Tag = "v0.1.11-beta.1"; Bundle = "peggy-win-x64-setup.exe" },
            @{ Tag = "v0.1.11"; Bundle = (ConvertTo-PeggyInstallerVersion -Version "v0.1.11").AssetNames.Bundle },
            @{ Tag = "v0.1.12"; Bundle = (ConvertTo-PeggyInstallerVersion -Version "v0.1.12").AssetNames.Bundle }
          )
          foreach ($baselineRelease in $baselines) {
            $baselineTag = $baselineRelease.Tag
            $bundleName = $baselineRelease.Bundle
            $checksumName = "$bundleName.sha256"
            $baseline = Join-Path $env:RUNNER_TEMP "peggy-upgrade-baseline-$baselineTag"
            New-Item -ItemType Directory -Path $baseline -Force | Out-Null
            gh release download $baselineTag --repo "${{ github.repository }}" `
              --pattern $bundleName --pattern $checksumName `
              --dir $baseline --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Could not download the pinned $baselineTag upgrade baseline."
            }
            $previousMsi = .\scripts\Expand-PeggyBundleMsi.ps1 `
              -Version $baselineTag `
              -BundlePath (Join-Path $baseline $bundleName) `
              -OutputDirectory $baseline
            .\scripts\Test-PeggyWindowsUpgrade.ps1 `
              -PreviousMsiPath $previousMsi `
              -MsiPath (Join-Path $env:RUNNER_TEMP $names.Msi) `
              -PayloadDirectory (Join-Path $env:RUNNER_TEMP "peggy-win-x64") `
              -OutputDirectory (Join-Path $env:RUNNER_TEMP "peggy-upgrade-$baselineTag")
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          . .\scripts\PeggyInstallerVersion.ps1
          $assets = @(Get-PeggyPublishedAssetNames -Version $tag | ForEach-Object {
            Join-Path $env:RUNNER_TEMP $_
          })

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            $arguments = @(
              "release", "create", $tag
            ) + $assets + @(
              "--verify-tag",
              "--generate-notes",
              "--title", "Peggy $tag"
            )
            if ($tag.Contains("-")) {
              $arguments += "--prerelease"
            }
            & gh @arguments
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release creation failed."
          }
